<!doctype html><html><head><meta charset="utf-8"><title>SVI Rail Test Platform</title><style>body{font:16px system-ui;margin:2rem;max-width:1000px}textarea{width:100%;height:180px}button{padding:.6rem 1rem;margin:.5rem 0}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:.45rem;text-align:left}.SUCCESS{color:green}.FAILURE{color:#b00}.SIMULATED{color:#965d00}</style></head><body><h1>SVI Rail Test Platform</h1><p>Paste legacy route configuration, validate it, then create a run. Default mode is simulation; desktop control requires the <code>desktop-runner</code> profile and explicit runner configuration.</p><textarea id="config" placeholder="101A(201-OV1)-CHANGE=101C101-Menu.png,MN_RT_Set^D201_G.png#D201-Menu.png,EXIT_with_OV1^WAITSEC,10"></textarea><br><button onclick="send('/api/routes/validate')">Validate</button><button onclick="send('/api/routes/runs')">Run</button><pre id="output"></pre><h2>Latest results</h2><table><thead><tr><th>Time</th><th>Route</th><th>Operation</th><th>Status</th><th>Duration</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table><script>async function send(url){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},body:config.value});output.textContent=await r.text();load()}async function load(){const r=await fetch('/api/routes/runs');const data=await r.json();rows.innerHTML=data.map(x=>`<tr><td>${x.completedAt}</td><td>${x.routeName}</td><td>${x.operation}</td><td class="${x.status}">${x.status}</td><td>${x.durationMillis} ms</td><td>${x.detail}</td></tr>`).join('')}load()</script></body></html>
